<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Símbolo Feito à Mão</title>
  <desc id="desc">Duas mãos de barro sustentam uma borda com uma seta voltada para cima e um detalhe dourado.</desc>
  <defs>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d88b5e"/>
      <stop offset="0.52" stop-color="#bd6d45"/>
      <stop offset="1" stop-color="#914729"/>
    </linearGradient>
    <linearGradient id="clayLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dd9365"/>
      <stop offset="1" stop-color="#ad5a36"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4a64b"/>
      <stop offset="0.55" stop-color="#b57b24"/>
      <stop offset="1" stop-color="#8e5f19"/>
    </linearGradient>
  </defs>

  <!-- Detalhe dourado -->
  <path d="M203 82 256 29l53 53" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Borda superior de barro -->
  <path d="M116 139c45-8 235-8 280 0" fill="none" stroke="url(#clayLight)" stroke-width="27" stroke-linecap="round"/>
  <path d="M119 143c5 25 12 47 26 69" fill="none" stroke="url(#clay)" stroke-width="18" stroke-linecap="round"/>
  <path d="M393 143c-5 25-12 47-26 69" fill="none" stroke="url(#clay)" stroke-width="18" stroke-linecap="round"/>

  <!-- Seta central de barro apontando para cima -->
  <path d="M153 303 256 177l103 126" fill="none" stroke="url(#clayLight)" stroke-width="55" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Mão esquerda -->
  <g>
    <path d="M101 177c-18 5-22 25-22 48 0 64 16 132 50 190 20 34 56 58 104 63 11 1 21-6 22-17 1-9-5-17-14-21-38-15-58-43-70-72-9-23-16-49-20-76-2-15-12-26-25-25-13 1-20 14-17 28 4 22 10 43 18 63-16-28-25-61-29-96-3-30 5-53 13-68 8-15 5-32-10-37Z" fill="url(#clay)"/>
    <path d="M132 265c-12-2-23 7-24 20-2 20 8 49 22 75 12 23 27 44 44 60 8 7 20 6 27-2 7-9 5-21-3-28-24-21-39-48-47-78-3-13-5-25-7-34-1-7-5-12-12-13Z" fill="url(#clayLight)"/>
    <path d="M110 215c8 45 18 74 34 102" fill="none" stroke="#7f3c25" stroke-width="4" stroke-linecap="round" opacity=".46"/>
    <path d="M128 281c5 28 15 54 30 77" fill="none" stroke="#7f3c25" stroke-width="3.5" stroke-linecap="round" opacity=".42"/>
    <path d="M146 397c17 25 39 40 66 50" fill="none" stroke="#e5a17a" stroke-width="3" stroke-linecap="round" opacity=".35"/>
  </g>

  <!-- Mão direita, espelhada -->
  <g transform="translate(512 0) scale(-1 1)">
    <path d="M101 177c-18 5-22 25-22 48 0 64 16 132 50 190 20 34 56 58 104 63 11 1 21-6 22-17 1-9-5-17-14-21-38-15-58-43-70-72-9-23-16-49-20-76-2-15-12-26-25-25-13 1-20 14-17 28 4 22 10 43 18 63-16-28-25-61-29-96-3-30 5-53 13-68 8-15 5-32-10-37Z" fill="url(#clay)"/>
    <path d="M132 265c-12-2-23 7-24 20-2 20 8 49 22 75 12 23 27 44 44 60 8 7 20 6 27-2 7-9 5-21-3-28-24-21-39-48-47-78-3-13-5-25-7-34-1-7-5-12-12-13Z" fill="url(#clayLight)"/>
    <path d="M110 215c8 45 18 74 34 102" fill="none" stroke="#7f3c25" stroke-width="4" stroke-linecap="round" opacity=".46"/>
    <path d="M128 281c5 28 15 54 30 77" fill="none" stroke="#7f3c25" stroke-width="3.5" stroke-linecap="round" opacity=".42"/>
    <path d="M146 397c17 25 39 40 66 50" fill="none" stroke="#e5a17a" stroke-width="3" stroke-linecap="round" opacity=".35"/>
  </g>

  <!-- Base que une visualmente as mãos -->
  <path d="M151 430c25 31 60 48 105 48s80-17 105-48" fill="none" stroke="url(#clay)" stroke-width="23" stroke-linecap="round"/>
</svg>
